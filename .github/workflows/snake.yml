name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0EA5E9&color_dots=#E2E8F0,#99F6E4,#2DD4BF,#0EA5E9,#2563EB
            dist/snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#161b22,#134E4A,#0F766E,#0EA5E9,#2563EB

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
